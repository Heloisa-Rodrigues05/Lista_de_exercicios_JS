<body>
    


    <script>
let num = parseInt(prompt("Digite um numero inteiro positivo"));
let ehPrimo = true;

if(num <= 1) {
    ehPrimo = false;
} else {
    for (let i = 2; i < num; i++);{
        if (num % i === 0) {
            ehPrimo = false;
            
        }
    }
}
if (ehPrimo) {
    console.log(num + "e primo");
} else {
    console.log(num + "nao e primo");
}
    </script>

</body>
</html>
