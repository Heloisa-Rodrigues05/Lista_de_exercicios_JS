<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<!--Solicite um numero e informe se ele e positivo, negativo ou igual a zero.-->

    <script>
let numero = parseFloat(prompt("Digite um numero"));

if (numero > 0) {
    console.log ("O numero e positivo");
} else if (numero < 0) {
    console.log ("O numero e negativo");
} else {
    console.log ("O numero e igual a zero");
}
    </script>

</body>
</html>
