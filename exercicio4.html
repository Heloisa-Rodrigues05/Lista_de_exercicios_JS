<!--Solicite um numero inteiro positivo e calcule a soma de todos os numeros de 1 ate o valor informado.-->

    <script>
let limite = parseInt(prompt("Digite um numero inteiro positivo"));
let soma = 0;

for (var i = 1; i <= limite; i++);
{
    soma = soma + i; 
     
}
console.log("A soma de 1 ate " + limite + " e: " + soma);
    </script>

</body>
